name: Atualizar agenda de PPVs (JOJO Library)

on:
  schedule:
    - cron: '17 9 * * *' # 06:17 horário de Brasília (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jojo-library-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes do extrator
        run: python -m unittest discover -s scripts/tests -v
      - name: Buscar novos PPVs nas agendas oficiais
        run: python scripts/update_ppvs.py
      - name: Publicar apenas se houver mudança
        run: |
          git add updates.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Atualizar agenda oficial de PPVs'
            git push
          else
            echo 'Nenhum PPV novo encontrado'
          fi
