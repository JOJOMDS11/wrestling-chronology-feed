name: Atualizar agenda oficial (JOJO Library)

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jojo-updates-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar parser da Wikipédia
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validar os monitores
        run: python -m unittest discover -s scripts/tests -v
      - name: Publicar agenda com sincronização e tentativas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            echo "Tentativa ${attempt}/5: revalidando a versão atual"
            git fetch origin main
            git reset --hard origin/main
            # Recalculate instead of merging stale or overwriting approved sources.
            python scripts/update_ppvs.py
            python scripts/discover_archive.py || echo 'Internet Archive indisponível: mantendo a última lista de candidatos'
            python scripts/import_wikipedia_ppvs.py || echo 'Wikipédia indisponível: mantendo referências históricas anteriores'
            python scripts/audit_ppvs.py
            git add updates.json archive_candidates.json ppv_audit.json config/ppv_wikipedia_reference.json
            if git diff --cached --quiet; then
              echo 'Nenhuma alteração nova para publicar.'
              exit 0
            fi
            git commit -m 'Atualizar agenda de eventos JOJO Library'
            if git push origin HEAD:main; then
              echo 'Agenda publicada com sucesso.'
              exit 0
            fi
            echo 'A branch mudou; recalculando sem force-push.'
            sleep 5
          done
          echo 'Falha: houve alterações concorrentes repetidas.' >&2
          exit 1
