name: Atualizar agenda oficial (JOJO Library)

on:
  schedule:
    - cron: '17 9 * * *' # Atualização diária de agendas oficiais em UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jojo-library-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar os monitores
        run: python -m unittest discover -s scripts/tests -v
      - name: Atualizar somente agendas oficiais (sem monitor OK.ru público)
        run: python scripts/update_ppvs.py
      - name: Publicar somente a agenda
        run: |
          git add updates.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Atualizar agenda de eventos JOJO Library'
            git push
          else
            echo 'Sem mudanças na agenda'
          fi
