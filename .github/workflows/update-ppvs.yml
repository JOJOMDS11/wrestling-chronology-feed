name: Atualizar eventos e monitorar fontes (JOJO Library)

on:
  schedule:
    - cron: '17 */6 * * *' # A cada seis horas, em UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jojo-library-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar os monitores
        run: python -m unittest discover -s scripts/tests -v
      - name: Consultar eventos oficiais
        run: python scripts/update_ppvs.py
      - name: Consultar perfis públicos e verificar links conhecidos
        run: python scripts/monitor_sources.py
      - name: Publicar somente se houver mudanças
        run: |
          git add updates.json video_candidates.json source_monitor_status.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Atualizar agenda e estado das fontes da JOJO Library'
            git push
          else
            echo 'Sem novas mudanças para publicar'
          fi
