name: JOJO Library - AutoMatch e RAW
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' && format('JOJO Sync {0}', inputs.request_id) || 'JOJO Sync automática' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador privado da solicitação manual
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: jojo-updates-json
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recalcular e publicar em branch atual com retry seguro
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "Tentativa ${attempt}/4: atualizar branch e recalcular alterações"
            git fetch origin main
            git reset --hard origin/main
            python3 .github/scripts/jojo_sync.py
            if git diff --quiet -- updates.json; then
              echo 'Nenhuma alteração nova para publicar.'
              exit 0
            fi
            git add updates.json
            git commit -m 'JOJO: revisar videos aprovados e atualizar RAW provisoria'
            if git push origin HEAD:main; then
              echo 'Alterações publicadas com sucesso.'
              exit 0
            fi
            echo 'Push recusado: branch mudou. Nova tentativa com conteúdo atualizado.'
            sleep "$((attempt * 2))"
          done
          echo 'Falha: branch mudou repetidamente. Nenhum force-push foi usado.' >&2
          exit 1
